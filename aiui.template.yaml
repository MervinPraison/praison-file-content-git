schemaVersion: 1
site:
  title: WP Git Posts
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: Git-based WordPress content loader - Markdown, JSON, YAML without database
    writes
seo:
  siteUrl: https://wpgit.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      icon: rocket
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/configuration
      icon: rocket
      prefix: getting-started
    - group: Features
      pages:
      - features/file-based-content
      - features/export
      - features/bidirectional-sync
      - features/incremental-indexing
      - features/virtual-post-meta
      - features/deletion-handling
      - features/collaborative-editing
      - features/performance
      icon: book-open
      prefix: features
    - group: Guides
      pages:
      - guides/deployment
      - guides/troubleshooting
      icon: book-open
      prefix: guides
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/wp-git-posts
footer:
  socials:
    github: https://github.com/MervinPraison/wp-git-posts
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: WP Git Posts
  footer_main:
    type: Footer
    props:
      text: WP Git Posts
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
